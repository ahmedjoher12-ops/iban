<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>AHMAD AKILAN — Bank Transfer</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:24px;background:#f4f4f6;color:#111;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
.card{
 width:100%;max-width:430px;background:#fff;border-radius:26px;padding:34px 24px;
 box-shadow:0 18px 55px rgba(0,0,0,.10);text-align:center
}
.badge{
 display:inline-block;padding:7px 11px;border-radius:999px;background:#f2f2f4;
 font-size:12px;font-weight:700;letter-spacing:1.2px;margin-bottom:24px
}
h1{font-size:26px;margin:0 0 7px}
.bank{font-size:17px;color:#666;margin-bottom:30px}
.label{font-size:12px;color:#8b8b91;letter-spacing:1.3px;margin-bottom:10px}
.iban{
 background:#f6f6f8;border:1px solid #ededf0;border-radius:16px;
 padding:18px 12px;font-size:17px;font-weight:700;line-height:1.55;
 letter-spacing:.5px;word-break:break-word;margin-bottom:15px
}
button{
 width:100%;border:0;border-radius:15px;padding:17px 16px;background:#111;color:#fff;
 font-size:16px;font-weight:800;cursor:pointer;transition:.15s
}
button:active{transform:scale(.98)}
button.done{background:#16794b}
.status{height:22px;margin-top:12px;font-size:14px;color:#16794b;font-weight:600}
.hint{margin-top:20px;color:#929299;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="badge">BANK TRANSFER</div>
  <h1>AHMAD AKILAN</h1>
  <div class="bank">QNB BANK</div>
  <div class="label">IBAN</div>
  <div class="iban">TR28 0011 1000 0000 0129 1501 69</div>
  <button id="copyButton" type="button" onclick="copyIBAN()">COPY IBAN</button>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="hint">Tap the button to copy the IBAN, then paste it into your banking app.</div>
</main>
<script>
async function copyIBAN(){
  const iban="TR280011100000000129150169";
  const button=document.getElementById("copyButton");
  const status=document.getElementById("status");
  try{
    await navigator.clipboard.writeText(iban);
  }catch(e){
    const t=document.createElement("textarea");
    t.value=iban;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.focus();t.select();
    document.execCommand("copy");document.body.removeChild(t);
  }
  button.textContent="✓ IBAN COPIED";
  button.classList.add("done");
  status.textContent="Ready to paste into your banking app";
  setTimeout(()=>{
    button.textContent="COPY IBAN";
    button.classList.remove("done");
    status.textContent="";
  },3000);
}
</script>
</body>
</html>
